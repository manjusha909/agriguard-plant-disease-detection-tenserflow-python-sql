<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AgriGuard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Blurred background */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url("{{ url_for('static', filename='images/indeximg.jpg') }}") no-repeat center center/cover;
            filter: blur(6px);
            z-index: -1;
        }

        .container {
            background: rgba(255, 255, 255, 0.9); /* semi-transparent for readability */
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            width: 350px;
            text-align: center;
            z-index: 1;
        }

        h2 { margin-bottom: 20px; color: #2c3e50; }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2980b9;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover { background: #3498db; }

        p { margin-top: 15px; }
        a { color: #27ae60; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .error { color: red; margin-bottom: 10px; }

        .admin-note { font-size: 14px; color: #555; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Login</h2>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <form method="POST">
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <p class="admin-note">Admins use their registered email and password to login.</p>
        <p>No account? <a href="/register">Register</a></p>
    </div>
</body>
</html>
